# EQ_llm_predict — LLM-baseline inference entry point.
#
# Serializes task histories as text, queries a locally-served LLM (OpenAI-compatible API,
# e.g. vLLM) for per-row occurrence probabilities, and writes PredictionSchema-conformant
# parquets consumable by EQ_evaluate unchanged.  See
# src/every_query/llm_baseline/README.md for serving setup and usage.

defaults:
  - _self_

# Required: path to a directory of TaskQuerySchema-conformant parquet files (same contract
# as EQ_predict's tasks_dir).
tasks_dir: ???

# Required: path to the tokenized-and-tensorized MEDS cohort produced by EQ_process_data /
# MTD_preprocess.  EQ_predict recovers this from the training run's resolved config; the
# LLM baseline has no run dir, so it's a direct input.
tensorized_cohort_dir: ???

# Required: output directory.  Completed rows stream to {output_dir}/shards/ (plus a
# details_shards/ sidecar carrying parse_failed and the Yes/No/unparsed vote counts); on
# completion the shards are merged into {output_dir}/predictions.parquet and
# {output_dir}/details.parquet.
output_dir: ???

# Which tensorized-cohort split the task subjects live in.  Same convention as EQ_predict.
split: held_out

# ── LLM server ──────────────────────────────────────────────────────────────────────────

# OpenAI-compatible endpoint of the locally-served model (vLLM default).
base_url: http://localhost:8000/v1
# vLLM ignores the key but the openai SDK requires one.
api_key: EMPTY
# Served model name — must match what vLLM was launched with.
model: meta-llama/Llama-3.1-8B-Instruct
# Optional HF revision the served model was pinned to.  Not used to make requests (the
# server owns the weights) — recorded in the output parquet metadata for reproducibility.
model_revision: null

# ── Probability extraction (repeated-sampling vote) ─────────────────────────────────────

# Number of Yes/No samples drawn per query (one n-way completion, so the patient history is
# prefilled once and shared across all samples).  The empirical fraction of "Yes" answers is
# the occurrence probability, so the score takes one of n_samples + 1 discrete values — more
# samples buy finer resolution and lower variance at linear decode cost.
n_samples: 20
# Constrain each sampled answer to exactly "Yes" or "No" via vLLM guided decoding, so every
# sample counts and there is nothing to parse-fail on.  Set false for servers without
# guided_choice support (the leading Yes/No word is then parsed leniently instead).
guided_choice: true
# Symmetric Laplace prior on the Yes/No vote:  prob = (n_yes + s) / (n_yes + n_no + 2s).
# 0.0 = raw empirical fraction.  A small positive value keeps the score off the exact 0/1
# endpoints — irrelevant for AUROC (monotonic) but keeps log-loss / Brier finite downstream.
smoothing: 0.0
# Written on total parse failure (no sample produced a usable Yes/No).  null → 0.5.  Set
# explicitly to inject an external estimate (e.g. training-split prevalence) — never computed
# from the evaluated split's own labels, which would leak ground truth into predictions.
# Failures are always flagged in the details sidecar's parse_failed column — never coerced.
fallback_prob: null
# Extra JSON fields merged into every request body (vLLM/OpenAI extensions).  Needed for
# thinking-style models whose answer would otherwise be reasoning rather than Yes/No,
# e.g. Qwen3.5:  extra_body='{chat_template_kwargs: {enable_thinking: false}}'
extra_body: null

# ── Serialization ───────────────────────────────────────────────────────────────────────

# Keep the most recent max_events events (unique timestamps); older ones are dropped with a
# marker line.  Per-run truncation stats are logged.
max_events: 256
# Optional code → human-readable description mapping (.json dict, or .parquet with
# code/description columns, e.g. a MEDS metadata/codes.parquet).  null renders raw codes —
# keep as the on/off switch for the description ablation.
code_descriptions: null

# ── Generation / execution ──────────────────────────────────────────────────────────────

# Sampling temperature.  MUST be > 0 for the repeated-sampling vote — at 0 every sample is
# identical and the probability collapses to 0 or 1 (construction raises when n_samples > 1
# and temperature == 0).  0.7 is a reasonable default; worth sweeping.
temperature: 0.7
seed: 0
# Concurrent in-flight requests to the local server (semaphore-bounded).
max_concurrency: 16
# Completed rows per output shard flush.
batch_size: 500
# Per-request timeout (seconds) and retry budget for transient transport errors
# (connection / timeout / 429 / 5xx), with exponential backoff.  Exhausted retries abort
# the run — restart with resume=true.
request_timeout: 120
max_retries: 5

# ── Smoke path / restarts ───────────────────────────────────────────────────────────────

# Cap the number of rows processed (after resume filtering).  null = no cap.
limit: null
# Skip rows already present in {output_dir}/shards/ instead of refusing to start.
resume: false
# Print ~3 fully serialized prompts and exit without contacting the server.
dry_run: false

hydra:
  output_subdir: null
  job:
    chdir: false
